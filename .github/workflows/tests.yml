name: Tests

# Se corre en cada empujón a main y en cada pull request. La suite es la misma
# que se ejecuta a mano (`php artisan test`): si aquí sale verde, el despliegue
# puede ir con el mismo respaldo.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: Laravel
    runs-on: ubuntu-latest

    # Los tests usan RefreshDatabase contra MariaDB (no hay pdo_sqlite en esta
    # instalación), así que hace falta un servidor de verdad.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: electronica_hogar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: electronica_hogar_test
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, xml, mbstring, pdo_mysql, gd, zip, fileinfo, openssl, bcmath, intl, curl
          coverage: none

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      # Las vistas usan @vite y el manifiesto no viaja en git: sin compilar los
      # assets, cualquier test que renderice una pantalla revienta. Va después
      # de crear el .env, que es de donde Vite toma las variables VITE_*.
      - name: Dependencias de JS y assets
        run: npm ci && npm run build

      - name: Ejecutar los tests
        run: php artisan test
